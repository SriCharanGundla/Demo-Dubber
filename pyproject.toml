[project]
name = "demo-dubber"
version = "0.2.0"
description = "React and FastAPI app for timestamped demo-video transcription and Kokoro dubbing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "certifi>=2026.10.19",
    "numpy>=2.3.3",
    "openai>=1.107.0",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "soundfile>=0.13.1",
    "streamlit>=1.49.0",
    "torch>=2.10.0",
    "kokoro>=0.9.4",
    "faster-whisper>=1.2.1",
    "pip>=26.0.1",
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "python-multipart>=0.0.20",
    "mlx-whisper>=0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py312"
line-length = 88
